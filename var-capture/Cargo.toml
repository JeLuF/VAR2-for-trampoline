[package]
name = "var-capture"
description = "Capture device enumeration and per-camera capture pipelines"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
var-core.workspace = true
chrono.workspace = true
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-video.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
